<!DOCTYPE html>
<html>

<head>
  <title>Ujian</title>

  <link rel="stylesheet" href="ujian.css">
</head>

<body>

<div class="exam-box">

  <h1 class="exam-title">
    Ujian Bahasa Inggris
  </h1>

  <div class="timer" id="timer">
  ⏰ 10:00
</div>

  <div class="question">

    <h2>
      1. What is the correct answer?
    </h2>

    <div class="option">
      A. Apple
    </div>

    <div class="option">
      B. Car
    </div>

    <div class="option">
      C. House
    </div>

    <div class="option">
      D. Water
    </div>

  </div>

  <button
  class="finish-btn"
  onclick="window.location.href='hasil.html'">

    Selesai Ujian

  </button>

</div>
<script>

let time = 600;

const timer =
document.getElementById("timer");

setInterval(() => {

  let minutes =
  Math.floor(time / 60);

  let seconds =
  time % 60;

  if(seconds < 10){
    seconds = "0" + seconds;
  }

  timer.innerHTML =
  "⏰ " + minutes + ":" + seconds;

  time--;

  if(time < 0){

    alert("Waktu habis!");

    window.location.href =
    "hasil.html";

  }

},1000);

</script>
</body>
</html>
