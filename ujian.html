<!DOCTYPE html>
<html>

<head>
  <title>Ujian</title>

  <link rel="stylesheet" href="ujian.css">
</head>

<body>

<div class="exam-box">

  <h1 class="exam-title">
    Ujian Bahasa Inggris
  </h1>

  <div class="timer" id="timer">
    ⏰ 10:00
  </div>

  <div class="question">

    <h2>
      1. Mana jawaban yang benar?
    </h2>

    <div class="option" onclick="checkAnswer(this,false)">
      A. Apel
    </div>

    <div class="option" onclick="checkAnswer(this,true)">
      B. Car
    </div>

    <div class="option" onclick="checkAnswer(this,false)">
      C. Rumah
    </div>

    <div class="option" onclick="checkAnswer(this,false)">
      D. Air
    </div>

  </div>

  <button
  class="finish-btn"
  onclick="window.location.href='hasil.html'">

    Selesai Ujian

  </button>

</div>

<script>

// TIMER

let time = 600;

const timer =
document.getElementById("timer");

setInterval(function(){

  let minutes =
  Math.floor(time / 60);

  let seconds =
  time % 60;

  if(seconds < 10){
    seconds = "0" + seconds;
  }

  timer.innerHTML =
  "⏰ " + minutes + ":" + seconds;

  time--;

},1000);


// JAWABAN

function checkAnswer(element,isCorrect){

  const options =
  document.querySelectorAll(".option");

  options.forEach(function(option){

    option.style.pointerEvents =
    "none";

  });

  if(isCorrect){

    element.style.background =
    "#22c55e";

    element.style.color =
    "white";

  }else{

    element.style.background =
    "#ef4444";

    element.style.color =
    "white";

  }

}

</script>

</body>
</html>
