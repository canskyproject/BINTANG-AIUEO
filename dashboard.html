<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINTANG AIUEO</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/png" href="logo.jpg">
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="top-header">
    <div class="logo-area">
      <img src="logo.jpg" alt="Logo">
    </div>
    <div class="profile-center" onclick="window.location.href='profile.html'">
      <img src="https://i.pravatar.cc/150?img=12" alt="Profil">
    </div>
    <div class="header-icons">
      <i class="fa-solid fa-cart-shopping"></i>
      <i class="fa-solid fa-bell"></i>
      <i id="theme-toggle" class="fa-solid fa-sun"></i>
      <i class="fa-solid fa-expand" onclick="toggleFullscreen()"></i>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="main-content">

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterKompetisi('semua', this)">Semua</button>
      <button class="filter-btn" onclick="filterKompetisi('online', this)">Online</button>
      <button class="filter-btn" onclick="filterKompetisi('offline', this)">Offline</button>
      <button class="filter-btn" onclick="filterKompetisi('pelatihan', this)">Pelatihan</button>
    </div>

    <!-- TITLE -->
    <h2 class="title">
      <i class="fa-solid fa-trophy"></i>
      Semua Kompetisi
    </h2>

    <!-- GRID -->
    <div class="competition-grid" id="competitionGrid">
      <div class="event-card">
        <div class="card-content">
          <h3>Memuat kompetisi...</h3>
        </div>
      </div>
    </div>

  </div>

  <!-- MOBILE NAV -->
  <div class="mobile-nav">
    <div class="mobile-item active" onclick="window.location.href='dashboard.html'">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </div>
    <div class="mobile-item" onclick="window.location.href='jadwal.html'">
      <i class="fa-regular fa-calendar-check"></i>
      <span>Jadwal</span>
    </div>
    <div class="mobile-item" onclick="window.location.href='transaksi.html'">
      <i class="fa-regular fa-credit-card"></i>
      <span>Transaksi</span>
    </div>
    <div class="mobile-item" onclick="window.location.href='pengumuman.html'">
      <i class="fa-regular fa-newspaper"></i>
      <span>Pengumuman</span>
    </div>
    <div class="mobile-item" onclick="window.location.href='riwayat.html'">
      <i class="fa-regular fa-file-lines"></i>
      <span>Riwayat</span>
    </div>
  </div>

</div>

<script>
/* =====================
   DARK MODE & FULLSCREEN
===================== */
const themeBtn = document.getElementById("theme-toggle");

themeBtn.onclick = () => {
  document.body.classList.toggle("dark");
  if (document.body.classList.contains("dark")) {
    themeBtn.classList.replace("fa-sun", "fa-moon");
    localStorage.setItem("theme", "dark");
  } else {
    themeBtn.classList.replace("fa-moon", "fa-sun");
    localStorage.setItem("theme", "light");
  }
};

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  themeBtn.classList.replace("fa-sun", "fa-moon");
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

/* =====================
   FILTER
===================== */
let allKompetisi = [];

function filterKompetisi(kategori, btn) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  const grid = document.getElementById("competitionGrid");
  grid.innerHTML = "";

  const filtered = kategori === "semua"
    ? allKompetisi
    : allKompetisi.filter(item => (item.data.kategori || "").toLowerCase() === kategori);

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="event-card"><div class="card-content"><h3>Tidak ada kompetisi untuk kategori ini.</h3></div></div>`;
    return;
  }

  filtered.forEach(({ id, data }) => {
    grid.innerHTML += buildCard(id, data);
  });
}

/* =====================
   COUNTDOWN — support semua format tanggal Indonesia
===================== */
function hitungHariLagi(tanggalStr) {
  if (!tanggalStr) return null;

  const bulanID = {
    "januari":0,"februari":1,"maret":2,"april":3,
    "mei":4,"juni":5,"juli":6,"agustus":7,
    "september":8,"oktober":9,"november":10,"desember":11
  };

  let target;
  const lower = tanggalStr.toLowerCase().trim();

  if (lower.includes("-")) {
    // Format: "2026-06-30"
    target = new Date(tanggalStr);
  } else if (lower.includes("/")) {
    // Format: "30/06/2026"
    const [d, m, y] = lower.split("/");
    target = new Date(`${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`);
  } else {
    // Format: "30 Juni 2026" atau "Minggu, 30 Juni 2026"
    const cleaned = lower.replace(/^[a-z]+,\s*/, "").trim();
    const parts = cleaned.split(/\s+/);
    const d = parseInt(parts[0]);
    const m = bulanID[parts[1]];
    const y = parseInt(parts[2]);
    if (isNaN(d) || m === undefined || isNaN(y)) return null;
    target = new Date(y, m, d);
  }

  if (!target || isNaN(target.getTime())) return null;

  const now = new Date();
  now.setHours(0, 0, 0, 0);
  target.setHours(0, 0, 0, 0);
  const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));

  if (diff < 0)  return "Sudah lewat";
  if (diff === 0) return "Hari ini!";
  return `${diff} hari lagi`;
}

/* =====================
   BUILD CARD
===================== */
function buildCard(id, data) {
  const countdown    = hitungHariLagi(data.tanggal);
  const countdownHTML = countdown
    ? `<span class="countdown-badge">${countdown}</span>`
    : "";

  const kategoriLower = (data.kategori || "online").toLowerCase();
  const statusColor   = kategoriLower === "offline" ? "#f59e0b"
                      : kategoriLower === "pelatihan" ? "#8b5cf6"
                      : "#22c55e";

  const harga = Number(data.biaya || 0).toLocaleString("id-ID");
  const poster = data.poster
    || "https://placehold.co/600x338/1976D2/ffffff?text=" + encodeURIComponent(data.nama || "Kompetisi");

  return `
    <div class="event-card" data-kategori="${kategoriLower}">
      <div class="status" style="background:${statusColor};">${data.kategori || "Online"}</div>
      <img
        class="banner"
        src="${poster}"
        alt="${data.nama}"
        onerror="this.src='https://placehold.co/600x338/1976D2/ffffff?text=Kompetisi'"
      >
      <div class="twibbon-badge">Twibbon</div>
      <div class="card-content">
        <h3>${data.nama}</h3>
        <p class="date">
          <i class="fa-regular fa-calendar"></i>
          ${data.tanggal || "-"}
          ${countdownHTML}
        </p>
        <div class="deadline-row">
          <i class="fa-regular fa-clock"></i>
          Akhir Pendaftaran: <strong>${data.akhirPendaftaran || "-"}</strong>
        </div>
        <div class="card-divider"></div>
        <div class="card-meta">
          <span><i class="fa-solid fa-users"></i> ${data.pendaftar || 0} Pendaftar</span>
          <span><i class="fa-solid fa-user-check"></i> Kuota ${data.kuota || 0}</span>
          <span><i class="fa-solid fa-clock"></i> ${data.jam || "-"}</span>
          <span><i class="fa-solid fa-money-bill-wave"></i> Rp ${harga}</span>
        </div>
        <div class="card-actions">
          <a class="btn-juknis" href="${data.juknis || '#'}" target="_blank">
            <i class="fa-regular fa-file-lines"></i> Juknis
          </a>
          <button class="btn-detail" onclick="window.location.href='detail.html?id=${id}'">
            Lihat Detail
          </button>
        </div>
      </div>
    </div>
  `;
}
</script>

<script type="module">
import { firestore } from "./firebase.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function loadKompetisi() {
  const grid = document.getElementById("competitionGrid");
  try {
    const snapshot = await getDocs(collection(firestore, "kompetisi"));
    grid.innerHTML = "";

    if (snapshot.empty) {
      grid.innerHTML = `<div class="event-card"><div class="card-content"><h3>Belum ada kompetisi</h3></div></div>`;
      return;
    }

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      allKompetisi.push({ id: docSnap.id, data });
      grid.innerHTML += buildCard(docSnap.id, data);
    });

  } catch (error) {
    grid.innerHTML = `
      <div class="event-card">
        <div class="card-content">
          <h3>Gagal memuat data</h3>
          <p>${error.message}</p>
        </div>
      </div>`;
  }
}

loadKompetisi();
</script>

<script type="module">
import { auth, firestore } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const profileImg = document.querySelector(".profile-center img");

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  try {
    const snap = await getDoc(doc(firestore, "users", user.uid));
    if (snap.exists()) {
      const d = snap.data();
      if (d.fotoUrl) {
        profileImg.src = d.fotoUrl;
        localStorage.setItem("fotoUrl", d.fotoUrl);
      }
    }
  } catch (e) {
    console.error(e);
  }
});
</script>

</body>
</html>
