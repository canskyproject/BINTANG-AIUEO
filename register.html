<!DOCTYPE html>
<html>

<head>
  <title>Register</title>

</head>

<body>

<div class="auth-box">

  </p>

  <div class="input-group">

    <label>Email</label>

    <input

    id="email"

  class="auth-btn"
  onclick="register()">

    Register

  </button>

    Sudah punya akun?
    <a href="login.html">
      Login
    </a>
  </p>

</div>

<script type="module" src="firebase.js"></script>

<script>

function register(){

  const email =
  document.getElementById('email').value;

  const password =
  document.getElementById('password').value;

  registerUser(email,password);

}

</script>

</body>
</html>
