<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f4f6;
padding:20px;
}

.profile-card{

max-width:600px;
margin:auto;

background:white;

border-radius:25px;

overflow:hidden;

box-shadow:
0 5px 20px rgba(0,0,0,.1);

}

.top-bar{

padding:20px;

font-size:28px;

cursor:pointer;

}

.profile-image{

display:flex;
justify-content:center;
position:relative;

margin-top:10px;

}

.profile-image img{

width:140px;
height:140px;

border-radius:50%;

object-fit:cover;

border:5px solid #1976D2;

}

.profile-image label{

position:absolute;

bottom:5px;
right:calc(50% - 75px);

width:50px;
height:50px;

border-radius:50%;

background:#1976D2;

color:white;

display:flex;

justify-content:center;
align-items:center;

cursor:pointer;

font-size:20px;

}

.profile-content{

padding:30px;

}

.profile-content h2{

text-align:center;

font-size:34px;

margin-bottom:8px;

}

.role{

text-align:center;

color:#666;

margin-bottom:30px;

}

.input-group{

margin-bottom:20px;

}

.input-group label{

display:block;

margin-bottom:8px;

font-weight:bold;

}

.input-group input{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:12px;

font-size:15px;

}

.save-btn{

width:100%;

border:none;

padding:14px;

border-radius:12px;

background:#1976D2;

color:white;

font-size:16px;

cursor:pointer;

}

.logout{

padding:20px;

text-align:center;

color:red;

cursor:pointer;

font-weight:bold;

border-top:1px solid #eee;

}

.logout i{

margin-right:8px;

}

</style>

</head>

<body>

<div class="profile-card">

<div class="top-bar">

<i
class="fa-solid fa-arrow-left"
onclick="window.location.href='dashboard.html'">
</i>

</div>

<div class="profile-image">

<img
id="preview"
src="https://i.pravatar.cc/300">

<label for="uploadPhoto">

<i class="fa-solid fa-camera"></i>

</label>

<input
type="file"
id="uploadPhoto"
hidden>

</div>

<div class="profile-content">

<h2 id="username">

Loading...

</h2>

<p class="role">

Peserta Kompetisi

</p>

<div class="input-group">

<label>Nama Baru</label>

<input
type="text"
id="newName"
placeholder="Masukkan nama baru">

</div>

<div class="input-group">

<label>Password Lama</label>

<input
type="password"
id="oldPassword">

</div>

<div class="input-group">

<label>Password Baru</label>

<input
type="password"
id="newPassword">

</div>

<div class="input-group">

<label>Ulangi Password Baru</label>

<input
type="password"
id="confirmPassword">

</div>

<button
class="save-btn"
onclick="saveProfile()">

Simpan Perubahan

</button>

</div>

<div
class="logout"
onclick="logoutUser()">

<i class="fa-solid fa-power-off"></i>

Logout

</div>

</div>

<script type="module">

import {

auth,
firestore,
signOut,
updatePassword

}

from "./firebase.js";

import {

doc,
getDoc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const username =
document.getElementById("username");

const newName =
document.getElementById("newName");

const preview =
document.getElementById("preview");

const uploadPhoto =
document.getElementById("uploadPhoto");

let currentUser = null;

/* LOAD USER */

auth.onAuthStateChanged(
async(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

currentUser = user;

try{

const docRef =
doc(
firestore,
"users",
user.uid
);

const snap =
await getDoc(docRef);

if(snap.exists()){

const data =
snap.data();

username.innerHTML =
data.name || "User";

newName.value =
data.name || "";

}

}catch(error){

console.log(error);

}

});

/* FOTO PREVIEW */

uploadPhoto.addEventListener(
"change",
function(){

const file =
this.files[0];

if(file){

preview.src =
URL.createObjectURL(file);

}

}
);

/* SAVE */

window.saveProfile =
async function(){

try{

if(!currentUser){

alert("Belum login");

return;

}

const nama =
newName.value;

await updateDoc(

doc(
firestore,
"users",
currentUser.uid
),

{
name:nama
}

);

username.innerHTML =
nama;

/* PASSWORD */

const passBaru =
document.getElementById("newPassword").value;

const confirm =
document.getElementById("confirmPassword").value;

if(
passBaru !== "" &&
confirm !== ""
){

if(passBaru !== confirm){

alert(
"Password tidak sama"
);

return;

}

await updatePassword(
currentUser,
passBaru
);

}

alert(
"Profile berhasil diperbarui 😄"
);

}catch(error){

alert(
error.message
);

}

};

/* LOGOUT */

window.logoutUser =
async function(){

await signOut(auth);

localStorage.clear();

window.location.href =
"login.html";

};

</script>

</body>
</html>
