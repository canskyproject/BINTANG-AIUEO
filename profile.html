<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f4f6;
padding:20px;
}

.profile-card{
max-width:500px;
margin:auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.top-bar{
padding:20px;
font-size:24px;
cursor:pointer;
}

.profile-image{
text-align:center;
position:relative;
}

.profile-image img{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:4px solid #1976D2;
}

.profile-image label{
position:absolute;
bottom:10px;
right:35%;
background:#1976D2;
color:white;
width:40px;
height:40px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.profile-content{
padding:25px;
}

.profile-content h2{
text-align:center;
margin-bottom:5px;
}

.role{
text-align:center;
color:#666;
margin-bottom:25px;
}

.input-group{
margin-bottom:15px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-weight:bold;
}

.input-group input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
}

.save-btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#1976D2;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.logout{
padding:20px;
text-align:center;
color:red;
font-weight:bold;
cursor:pointer;
border-top:1px solid #eee;
}

</style>

</head>

<body>

<div class="profile-card">

<div class="top-bar">

<i
class="fa-solid fa-arrow-left"
onclick="window.location.href='dashboard.html'">
</i>

</div>

<div class="profile-image">

<img
id="preview"
src="https://i.pravatar.cc/200?img=12">

<label for="upload-photo">

<i class="fa-solid fa-camera"></i>

</label>

<input
type="file"
id="upload-photo"
hidden>

</div>

<div class="profile-content">

<h2 id="username">
Loading...
</h2>

<p class="role">
Peserta Kompetisi
</p>

<div class="input-group">

<label>Nama Baru</label>

<input
type="text"
id="new-name"
placeholder="Masukkan nama baru">

</div>

<div class="input-group">

<label>Password Lama</label>

<input
type="password"
id="oldPassword"
placeholder="Password lama">

</div>

<div class="input-group">

<label>Password Baru</label>

<input
type="password"
id="newPassword"
placeholder="Password baru">

</div>

<div class="input-group">

<label>Ulangi Password Baru</label>

<input
type="password"
id="confirmPassword"
placeholder="Ulangi password baru">

</div>

<button
class="save-btn"
onclick="saveProfile()">

Simpan

</button>

</div>

<div
class="logout"
onclick="logout()">

<i class="fa-solid fa-power-off"></i>

Logout

</div>

</div>

<script type="module">

import {
auth,
firestore,
signOut
}
from "./firebase.js";

import {
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
EmailAuthProvider,
reauthenticateWithCredential,
updatePassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const username =
document.getElementById("username");

const newName =
document.getElementById("new-name");

async function loadProfile(){

try{

const uid =
localStorage.getItem("uid");

if(!uid) return;

const docSnap =
await getDoc(
doc(
firestore,
"users",
uid
)
);

if(docSnap.exists()){

const data =
docSnap.data();

username.innerHTML =
data.name || "User";

newName.value =
data.name || "";

}

}catch(error){

console.log(error);

}

}

loadProfile();

window.saveProfile =
async function(){

try{

const uid =
localStorage.getItem("uid");

if(!uid){

alert("Silakan login ulang");
return;

}

await updateDoc(

doc(
firestore,
"users",
uid
),

{
name:newName.value
}

);

username.innerHTML =
newName.value;

const oldPassword =
document.getElementById("oldPassword").value;

const newPassword =
document.getElementById("newPassword").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

if(
oldPassword &&
newPassword &&
confirmPassword
){

if(newPassword !== confirmPassword){

alert("Password baru tidak sama");
return;

}

const user =
auth.currentUser;

const credential =
EmailAuthProvider.credential(
user.email,
oldPassword
);

await reauthenticateWithCredential(
user,
credential
);

await updatePassword(
user,
newPassword
);

}

alert("Data berhasil disimpan 😄");

}catch(error){

alert(error.message);

}

};

const uploadPhoto =
document.getElementById("upload-photo");

const preview =
document.getElementById("preview");

uploadPhoto.addEventListener(
"change",
function(){

const file =
this.files[0];

if(file){

preview.src =
URL.createObjectURL(file);

}

}
);

window.logout =
async function(){

localStorage.clear();

await signOut(auth);

window.location.href =
"login.html";

};

</script>

</body>

</html>
