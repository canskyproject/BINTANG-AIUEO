<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — BINTANG AIUEO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/png" href="logo.jpg">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: Arial, sans-serif;
  background: #eef1f5;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 16px 48px;
}

.profile-card {
  width: 100%;
  max-width: 580px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.10);
  overflow: hidden;
}

/* HEADER */
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  border-bottom: 1px solid #f0f0f0;
  position: sticky;
  top: 0;
  background: white;
  z-index: 10;
}

.back-icon {
  color: #374151;
  font-size: 18px;
  cursor: pointer;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f3f4f6;
  border: none;
  transition: background 0.2s;
}
.back-icon:hover { background: #e5e7eb; }

.user-info-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar-wrap {
  position: relative;
  display: inline-block;
}

.avatar-wrap img {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #e5e7eb;
  display: block;
}

.camera-label {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #6b7280;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 9px;
  border: 2px solid white;
}

.upload-spinner {
  display: none;
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 18px;
}

.user-name-top  { font-size: 15px; font-weight: 700; color: #111; }
.user-role-top  { font-size: 12px; color: #6b7280; margin-top: 2px; }

/* BODY */
.card-body { padding: 8px 24px 24px; }

.section-label {
  font-size: 12px;
  font-weight: 700;
  color: #9ca3af;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 24px;
  margin-bottom: 2px;
}

/* INPUT UNDERLINE */
.input-group { margin-bottom: 2px; }

.input-group label {
  display: block;
  font-size: 13px;
  color: #6b7280;
  margin-bottom: 4px;
  margin-top: 18px;
}

.input-group input,
.input-group select {
  width: 100%;
  padding: 10px 0;
  border: none;
  border-bottom: 1.5px solid #e5e7eb;
  font-size: 15px;
  color: #111;
  background: transparent;
  outline: none;
  transition: border-color 0.2s;
  appearance: none;
  -webkit-appearance: none;
}

.input-group input:focus,
.input-group select:focus { border-bottom-color: #1976D2; }
.input-group input:disabled { color: #9ca3af; cursor: not-allowed; }

.select-wrap { position: relative; }
.select-wrap::after {
  content: "\f078";
  font-family: "Font Awesome 6 Free";
  font-weight: 900;
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
  font-size: 11px;
  pointer-events: none;
}

/* PASSWORD */
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 32px; }
.pw-wrap .eye-icon {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
  font-size: 14px;
  cursor: pointer;
}

/* DIVIDER */
.divider { height: 1px; background: #f3f4f6; margin: 24px 0 0; }

/* MSG */
.msg-box {
  display: none;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  margin-top: 14px;
}
.msg-box.error   { background:#fef2f2; border:1px solid #fecaca; color:#dc2626; }
.msg-box.success { background:#f0fdf4; border:1px solid #bbf7d0; color:#16a34a; }

/* BUTTONS */
.btn-simpan {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #16a34a;
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-simpan:hover:not(:disabled) { background: #15803d; }
.btn-simpan:active { transform: scale(0.98); }
.btn-simpan:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-password {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #1976D2;
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-password:hover:not(:disabled) { background: #1565C0; }
.btn-password:disabled { opacity: 0.6; cursor: not-allowed; }

/* SIGN OUT */
.signout-row {
  display: flex;
  justify-content: flex-end;
  padding: 14px 24px 20px;
  border-top: 1px solid #f3f4f6;
}

.signout-btn {
  background: none;
  border: none;
  color: #ef4444;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
}
.signout-btn:hover { opacity: 0.75; }
</style>
</head>
<body>

<div class="profile-card">

  <!-- HEADER -->
  <div class="card-header">
    <button class="back-icon" onclick="window.location.href='dashboard.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="user-info-top">
      <div class="avatar-wrap">
        <img id="preview" src="https://i.pravatar.cc/150?img=12" alt="Foto">
        <div class="upload-spinner" id="uploadSpinner">
          <i class="fa-solid fa-spinner fa-spin"></i>
        </div>
        <label class="camera-label" for="uploadPhoto">
          <i class="fa-solid fa-camera"></i>
        </label>
        <input type="file" id="uploadPhoto" hidden accept="image/*">
      </div>
      <div>
        <div class="user-name-top" id="heroName">Memuat...</div>
        <div class="user-role-top" id="heroRole">Peserta Kompetisi</div>
      </div>
    </div>
  </div>

  <!-- BODY -->
  <div class="card-body">

    <div class="section-label">Informasi Akun</div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="emailField" disabled>
    </div>

    <div class="input-group">
      <label>Nama Lengkap</label>
      <input type="text" id="newName" placeholder="Masukkan nama lengkap">
    </div>

    <div class="input-group">
      <label>No WhatsApp</label>
      <input type="tel" id="noWa" placeholder="08xxxxxxxxxx">
    </div>

    <div class="input-group">
      <label>Tanggal Lahir</label>
      <input type="date" id="tglLahir">
    </div>

    <div class="input-group">
      <label>Agama</label>
      <div class="select-wrap">
        <select id="agama">
          <option value="">Pilih agama</option>
          <option value="Islam">Islam</option>
          <option value="Kristen">Kristen</option>
          <option value="Katolik">Katolik</option>
          <option value="Hindu">Hindu</option>
          <option value="Buddha">Buddha</option>
          <option value="Konghucu">Konghucu</option>
        </select>
      </div>
    </div>

    <div class="input-group">
      <label>Jenis Kelamin</label>
      <div class="select-wrap">
        <select id="jenisKelamin">
          <option value="">Pilih jenis kelamin</option>
          <option value="Laki-Laki">Laki-Laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>
      </div>
    </div>

    <!-- DATA SEKOLAH -->
    <div class="divider"></div>
    <div class="section-label">Data Sekolah</div>

    <div class="input-group">
      <label>Akun sebagai</label>
      <div class="select-wrap">
        <select id="akunSebagai">
          <option value="">Pilih peran</option>
          <option value="Siswa">Siswa</option>
          <option value="Mahasiswa">Mahasiswa</option>
          <option value="Guru">Guru</option>
          <option value="Umum">Umum</option>
        </select>
      </div>
    </div>

    <div class="input-group">
      <label>Jenjang</label>
      <div class="select-wrap">
        <select id="jenjang">
          <option value="">Pilih jenjang</option>
          <option value="SD">SD</option>
          <option value="SMP">SMP</option>
          <option value="SMA">SMA</option>
          <option value="SMK">SMK</option>
          <option value="D3">D3</option>
          <option value="S1">S1</option>
          <option value="S2">S2</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>
    </div>

    <div class="input-group">
      <label>Provinsi Sekolah</label>
      <input type="text" id="provinsi" placeholder="Contoh: Kalimantan Barat">
    </div>

    <div class="input-group">
      <label>Kab / Kota Sekolah</label>
      <input type="text" id="kabKota" placeholder="Contoh: Kota Pontianak">
    </div>

    <div class="input-group">
      <label>Kecamatan Sekolah</label>
      <input type="text" id="kecamatan" placeholder="Contoh: Pontianak Selatan">
    </div>

    <div class="input-group">
      <label>Nama Sekolah</label>
      <input type="text" id="namaSekolah" placeholder="Contoh: SMA Negeri 1 Pontianak">
    </div>

    <div id="infoMsg" class="msg-box"></div>

    <button class="btn-simpan" id="btnSimpan" onclick="saveProfil()">
      <span id="btnSimpanText">Simpan</span>
    </button>

    <!-- GANTI PASSWORD -->
    <div class="divider"></div>
    <div class="section-label">Ganti Password</div>

    <div class="input-group">
      <label>Password Baru</label>
      <div class="pw-wrap">
        <input type="password" id="newPassword" placeholder="Minimal 6 karakter">
        <i class="fa-regular fa-eye eye-icon" id="toggleNew"></i>
      </div>
    </div>

    <div class="input-group">
      <label>Konfirmasi Password Baru</label>
      <div class="pw-wrap">
        <input type="password" id="confirmPassword" placeholder="Ulangi password baru">
        <i class="fa-regular fa-eye eye-icon" id="toggleConfirm"></i>
      </div>
    </div>

    <div id="passMsg" class="msg-box"></div>

    <button class="btn-password" id="btnPass" onclick="savePassword()">
      <span id="btnPassText">Ganti Password</span>
    </button>

  </div>

  <!-- SIGN OUT -->
  <div class="signout-row">
    <button class="signout-btn" onclick="logoutUser()">
      <i class="fa-solid fa-power-off"></i> Sign Out
    </button>
  </div>

</div>

<script>
// =====================
// CLOUDINARY CONFIG
// =====================
const CLOUD_NAME    = "dsjh7ka49";
const UPLOAD_PRESET = "bintang_aiueo";

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}

// Toggle password
function makeToggle(inputId, iconId) {
  document.getElementById(iconId).addEventListener("click", function () {
    const input = document.getElementById(inputId);
    const hidden = input.type === "password";
    input.type = hidden ? "text" : "password";
    this.classList.toggle("fa-eye",       !hidden);
    this.classList.toggle("fa-eye-slash",  hidden);
  });
}
makeToggle("newPassword",     "toggleNew");
makeToggle("confirmPassword", "toggleConfirm");

function showMsg(elId, type, text) {
  const el = document.getElementById(elId);
  el.className = "msg-box " + type;
  el.textContent = text;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 4000);
}

function setLoading(btnId, textId, on, label) {
  document.getElementById(btnId).disabled = on;
  document.getElementById(textId).textContent = on ? "Memproses..." : label;
}

// =====================
// UPLOAD FOTO KE CLOUDINARY
// =====================
document.getElementById("uploadPhoto").addEventListener("change", async function () {
  const file = this.files[0];
  if (!file) return;

  // Tampilkan spinner
  const spinner = document.getElementById("uploadSpinner");
  spinner.style.display = "flex";

  try {
    const formData = new FormData();
    formData.append("file",           file);
    formData.append("upload_preset",  UPLOAD_PRESET);
    formData.append("folder",         "profil");

    const res  = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
      { method: "POST", body: formData }
    );
    const data = await res.json();

    if (data.secure_url) {
      // Update preview
      document.getElementById("preview").src = data.secure_url;

      // Simpan URL ke Firestore
      await savePhotoUrl(data.secure_url);
      showMsg("infoMsg", "success", "Foto profil berhasil diupload!");
    } else {
      showMsg("infoMsg", "error", "Gagal upload foto.");
    }
  } catch (e) {
    showMsg("infoMsg", "error", "Error upload: " + e.message);
  }

  spinner.style.display = "none";
});
</script>

<script type="module">
import { auth, firestore } from "./firebase.js";
import {
  onAuthStateChanged, signOut, updatePassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  doc, getDoc, setDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let currentUser = null;

// Simpan URL foto ke Firestore (dipanggil dari script biasa via window)
window.savePhotoUrl = async function (url) {
  if (!currentUser) return;
  await updateDoc(doc(firestore, "users", currentUser.uid), { fotoUrl: url });
  localStorage.setItem("fotoUrl", url);
};

// Load user
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "login.html"; return; }
  currentUser = user;
  document.getElementById("emailField").value = user.email;

  try {
    const snap = await getDoc(doc(firestore, "users", user.uid));
    if (snap.exists()) {
      const d    = snap.data();
      const nama = d.nama || d.name || user.displayName || "User";

      // Foto dari Cloudinary
      if (d.fotoUrl) {
        document.getElementById("preview").src = d.fotoUrl;
      }

      document.getElementById("heroName").textContent  = nama;
      document.getElementById("heroRole").textContent  = d.akunSebagai
        ? `${d.akunSebagai} - ${d.jenjang || ""}` : "Peserta Kompetisi";

      document.getElementById("newName").value         = nama;
      document.getElementById("noWa").value            = d.noWa          || "";
      document.getElementById("tglLahir").value        = d.tglLahir      || "";
      document.getElementById("agama").value           = d.agama         || "";
      document.getElementById("jenisKelamin").value    = d.jenisKelamin  || "";
      document.getElementById("akunSebagai").value     = d.akunSebagai   || "";
      document.getElementById("jenjang").value         = d.jenjang       || "";
      document.getElementById("provinsi").value        = d.provinsi      || "";
      document.getElementById("kabKota").value         = d.kabKota       || "";
      document.getElementById("kecamatan").value       = d.kecamatan     || "";
      document.getElementById("namaSekolah").value     = d.namaSekolah   || "";

      localStorage.setItem("nama", nama);
      if (d.fotoUrl) localStorage.setItem("fotoUrl", d.fotoUrl);
    }
  } catch (e) { console.error(e); }
});

// Simpan profil
window.saveProfil = async function () {
  if (!currentUser) return;
  const nama = document.getElementById("newName").value.trim();
  if (!nama) { showMsg("infoMsg","error","Nama tidak boleh kosong."); return; }

  const data = {
    nama,
    email:        currentUser.email,
    uid:          currentUser.uid,
    noWa:         document.getElementById("noWa").value.trim(),
    tglLahir:     document.getElementById("tglLahir").value,
    agama:        document.getElementById("agama").value,
    jenisKelamin: document.getElementById("jenisKelamin").value,
    akunSebagai:  document.getElementById("akunSebagai").value,
    jenjang:      document.getElementById("jenjang").value,
    provinsi:     document.getElementById("provinsi").value.trim(),
    kabKota:      document.getElementById("kabKota").value.trim(),
    kecamatan:    document.getElementById("kecamatan").value.trim(),
    namaSekolah:  document.getElementById("namaSekolah").value.trim(),
  };

  setLoading("btnSimpan","btnSimpanText", true, "Simpan");
  try {
    await setDoc(doc(firestore,"users",currentUser.uid), data, { merge: true });
    document.getElementById("heroName").textContent = nama;
    document.getElementById("heroRole").textContent = data.akunSebagai
      ? `${data.akunSebagai} - ${data.jenjang}` : "Peserta Kompetisi";
    localStorage.setItem("nama", nama);
    showMsg("infoMsg","success","Profil berhasil disimpan!");
  } catch (e) {
    showMsg("infoMsg","error", e.message);
  }
  setLoading("btnSimpan","btnSimpanText", false, "Simpan");
};

// Ganti password
window.savePassword = async function () {
  if (!currentUser) return;
  const passBaru = document.getElementById("newPassword").value;
  const confirm  = document.getElementById("confirmPassword").value;

  if (!passBaru || !confirm) { showMsg("passMsg","error","Isi semua field password."); return; }
  if (passBaru.length < 6)   { showMsg("passMsg","error","Password minimal 6 karakter."); return; }
  if (passBaru !== confirm)   { showMsg("passMsg","error","Password tidak cocok."); return; }

  setLoading("btnPass","btnPassText", true, "Ganti Password");
  try {
    await updatePassword(currentUser, passBaru);
    document.getElementById("newPassword").value     = "";
    document.getElementById("confirmPassword").value = "";
    showMsg("passMsg","success","Password berhasil diubah!");
  } catch (e) {
    if (e.code === "auth/requires-recent-login") {
      showMsg("passMsg","error","Sesi terlalu lama. Logout lalu login ulang.");
    } else {
      showMsg("passMsg","error", e.message);
    }
  }
  setLoading("btnPass","btnPassText", false, "Ganti Password");
};

// Logout
window.logoutUser = async function () {
  if (!confirm("Yakin ingin Sign Out?")) return;
  await signOut(auth);
  localStorage.clear();
  window.location.href = "login.html";
};
</script>

</body>
</html>
