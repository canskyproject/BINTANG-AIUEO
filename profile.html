<!DOCTYPE html>
<html>

<head>

  <title>Profile</title>

  <link rel="stylesheet" href="profile.css">

  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="profile-card">

  <!-- TOP -->

  <div class="top-bar">

    <i
    class="fa-solid fa-arrow-left"
    onclick="window.location.href='dashboard.html'">
    </i>

  </div>

  <!-- FOTO -->

  <div class="profile-image">

    <img
    id="preview"
    src="https://i.pravatar.cc/200?img=12">

    <label for="upload-photo">

      <i class="fa-solid fa-camera"></i>

    </label>

    <input
    type="file"
    id="upload-photo"
    hidden>

  </div>

  <!-- CONTENT -->

  <div class="profile-content">

    <h2 id="username">
      IQMALL
    </h2>

    <p class="role">
      Siswa - SMA
    </p>

    <!-- NAMA -->

    <div class="input-group">

      <label>
        Nama Baru
      </label>

      <input
      type="text"
      id="new-name"
      placeholder="Masukkan nama baru">

    </div>

    <!-- PASSWORD -->

    <div class="input-group">

      <label>
        Password Lama
      </label>

      <input
      type="password"
      placeholder="Password lama">

    </div>

    <div class="input-group">

      <label>
        Password Baru
      </label>

      <input
      type="password"
      placeholder="Password baru">

    </div>

    <div class="input-group">

      <label>
        Ulangi Password Baru
      </label>

      <input
      type="password"
      placeholder="Ulangi password">

    </div>

    <!-- BUTTON -->

    <button
    class="save-btn"
    onclick="saveProfile()">

      Save

    </button>

  </div>

  <!-- LOGOUT -->

  <div
  class="logout"
  onclick="logout()">

    <i class="fa-solid fa-power-off"></i>

    Logout

  </div>

</div>

<script type="module">

import {

  auth,
  db,
  doc,
  setDoc,
  getDoc,
  signOut

}

from "./firebase.js";

/* ELEMENT */

const username =
document.getElementById("username");

const newName =
document.getElementById("new-name");

const uploadPhoto =
document.getElementById("upload-photo");

const preview =
document.getElementById("preview");

/* LOAD PROFILE */

async function loadProfile(){

  const user =
  auth.currentUser;

  if(user){

    const docRef =
    doc(db,"users",user.uid);

    const docSnap =
    await getDoc(docRef);

    if(docSnap.exists()){

      const data =
      docSnap.data();

      username.innerHTML =
      data.name;

      newName.value =
      data.name;

    }

  }

}

setTimeout(() => {

  loadProfile();

},1000);

/* SAVE PROFILE */

window.saveProfile =
async function(){

  const user =
  auth.currentUser;

  if(user){

    await setDoc(
      doc(db,"users",user.uid),
      {

        name:newName.value

      },

      { merge:true }

    );

    username.innerHTML =
    newName.value;

    alert("Profile berhasil disimpan 😄");

  }

}

/* FOTO */

uploadPhoto.addEventListener("change",function(){

  const file =
  this.files[0];

  if(file){

    preview.src =
    URL.createObjectURL(file);

  }

});

/* LOGOUT */

window.logout =
async function(){

  await signOut(auth);

  window.location.href =
  "login.html";

}

</script>

</body>
</html>
