<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Transaksi</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f4f6;
padding:20px;
padding-bottom:100px;
}

.title{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.card{

background:white;

padding:20px;

border-radius:20px;

margin-bottom:15px;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

}

.card h3{

margin-bottom:10px;

color:#1976D2;

}

.card p{

margin-bottom:8px;

}

.status{

display:inline-block;

padding:6px 12px;

border-radius:10px;

font-size:13px;

font-weight:bold;

}

.menunggu{
background:#fff3cd;
color:#856404;
}

.lunas{
background:#d4edda;
color:#155724;
}

.ditolak{
background:#f8d7da;
color:#721c24;
}

.gratis{
background:#d1ecf1;
color:#0c5460;
}

.mobile-nav{

position:fixed;

bottom:0;
left:0;

width:100%;
height:75px;

background:white;

display:flex;

justify-content:space-around;
align-items:center;

border-top:1px solid #ddd;

}

.mobile-item{

display:flex;
flex-direction:column;

align-items:center;

color:#999;

cursor:pointer;

}

.mobile-item.active{

color:#1976D2;

}

.mobile-item i{

font-size:22px;

margin-bottom:4px;

}

</style>

</head>

<body>

<h1 class="title">

💳 Transaksi

</h1>

<div id="transaksiList">

<div class="card">

Memuat transaksi...

</div>

</div>

<div class="mobile-nav">

<div
class="mobile-item"
onclick="window.location.href='dashboard.html'">

<i class="fa-solid fa-house"></i> <span>Home</span>

</div>

<div
class="mobile-item"
onclick="window.location.href='jadwal.html'">

<i class="fa-regular fa-calendar-check"></i> <span>Jadwal</span>

</div>

<div
class="mobile-item active">

<i class="fa-regular fa-credit-card"></i> <span>Transaksi</span>

</div>

<div
class="mobile-item"
onclick="window.location.href='pengumuman.html'">

<i class="fa-regular fa-newspaper"></i> <span>Pengumuman</span>

</div>

<div
class="mobile-item"
onclick="window.location.href='riwayat.html'">

<i class="fa-regular fa-file-lines"></i> <span>Riwayat</span>

</div>

</div>

<script type="module">

import { firestore }
from "./firebase.js";

import {
collection,
getDocs,
query,
where,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const box =
document.getElementById("transaksiList");

const uid =
localStorage.getItem("uid");

async function uploadBukti(file,idTransaksi){

const formData =
new FormData();

formData.append(
"file",
file
);

formData.append(
"upload_preset",
"bintang_aiueo"
);

const response =
await fetch(
"https://api.cloudinary.com/v1_1/dsjh7ka49/image/upload",
{
method:"POST",
body:formData
}
);

const result =
await response.json();

await updateDoc(
doc(
firestore,
"transaksi",
idTransaksi
),
{
buktiTransfer:
result.secure_url
}
);

alert("Bukti transfer berhasil diupload");

loadTransaksi();

}

window.pilihFile =
function(id){

const input =
document.createElement("input");

input.type = "file";

input.accept = "image/*";

input.onchange =
async(e)=>{

const file =
e.target.files[0];

if(!file) return;

await uploadBukti(
file,
id
);

};

input.click();

};

async function loadTransaksi(){

try{

const q =
query(
collection(
firestore,
"transaksi"
),
where(
"uid",
"==",
uid
)
);

const snapshot =
await getDocs(q);

box.innerHTML = "";

snapshot.forEach((item)=>{

const data =
item.data();

const id =
item.id;

box.innerHTML += `

<div class="card">

<h3>
${data.noTransaksi || item.id}
</h3>

<p style="margin-top:10px;font-weight:bold;color:#1976D2;">
${data.kompetisi}
</p>

<p>
📅 ${data.tanggal}
</p>

<p>
⏳ Berlaku sampai :
${data.expired || "-"}
</p>

<p>
🏦 Metode :
${data.metode || "-"}
</p>

<p>
💰 Rp ${data.nominal}
</p>

<p>
Status :
<span class="status ${(data.status || "").toLowerCase()}">
${data.status}
</span>
</p>

<br>

${
data.buktiTransfer
?

`
<a
href="${data.buktiTransfer}"
target="_blank"
style="
background:#16a34a;
color:white;
padding:10px 15px;
border-radius:10px;
text-decoration:none;
display:inline-block;
">

Lihat Bukti

</a>
`

:

`
<button
onclick="pilihFile('${id}')"
style="
background:#1976D2;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
">

Upload Bukti

</button>
`
}

</div>

`;

});

if(snapshot.empty){

box.innerHTML = `

<div class="card">

Belum ada transaksi

</div>

`;

}

}catch(error){

box.innerHTML = `

<div class="card">

${error.message}

</div>

`;

}

}

loadTransaksi();

</script>

</body>
</html>
