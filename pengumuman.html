<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pengumuman</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f4f6;
padding:20px;
padding-bottom:100px;
}

.title{
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.card{

background:white;

padding:20px;

border-radius:20px;

margin-bottom:15px;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

}

.card h3{

margin-bottom:10px;

color:#1976D2;

}

.card p{

margin-bottom:10px;

line-height:1.6;

}

.date{

color:#666;

font-size:14px;

}

.mobile-nav{

position:fixed;

bottom:0;
left:0;

width:100%;
height:75px;

background:white;

display:flex;

justify-content:space-around;
align-items:center;

border-top:1px solid #ddd;

}

.mobile-item{

display:flex;
flex-direction:column;

align-items:center;

color:#999;

cursor:pointer;

}

.mobile-item.active{

color:#1976D2;

}

.mobile-item i{

font-size:22px;

margin-bottom:4px;

}

</style>

</head>

<body>

<h1 class="title">

📢 Pengumuman

</h1>

<div id="pengumumanList">

<div class="card">

Memuat pengumuman...

</div>

</div>

<div class="mobile-nav">

<div
class="mobile-item"
onclick="window.location.href='dashboard.html'">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</div>

<div
class="mobile-item"
onclick="window.location.href='jadwal.html'">

<i class="fa-regular fa-calendar-check"></i>

<span>Jadwal</span>

</div>

<div
class="mobile-item"
onclick="window.location.href='transaksi.html'">

<i class="fa-regular fa-credit-card"></i>

<span>Transaksi</span>

</div>

<div
class="mobile-item active">

<i class="fa-regular fa-newspaper"></i>

<span>Pengumuman</span>

</div>

<div
class="mobile-item"
onclick="window.location.href='riwayat.html'">

<i class="fa-regular fa-file-lines"></i>

<span>Riwayat</span>

</div>

</div>

<script type="module">

import { firestore }
from "./firebase.js";

import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const box =
document.getElementById(
"pengumumanList"
);

async function loadPengumuman(){

try{

const snapshot =
await getDocs(

collection(
firestore,
"pengumuman"
)

);

box.innerHTML = "";

snapshot.forEach((doc)=>{

const data =
doc.data();

box.innerHTML += `

<div class="card">

<h3>

${data.judul}

</h3>

<p>

${data.isi}

</p>

<div class="date">

${data.tanggal}

</div>

</div>

`;

});

if(snapshot.empty){

box.innerHTML =

`

<div class="card">

Belum ada pengumuman

</div>

`;

}

}catch(error){

box.innerHTML =

`

<div class="card">

${error.message}

</div>

`;

}

}

loadPengumuman();

</script>

</body>
</html>
