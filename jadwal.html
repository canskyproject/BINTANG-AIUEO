<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jadwal Kompetisi</title>

<link rel="stylesheet" href="jadwal.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="icon" href="logo.jpg">

</head>

<body>

<!-- HEADER -->

<div class="top-header">

  <div class="logo-area">
    <img src="logo.jpg" alt="Logo">
  </div>

  <div class="profile-center">
    <img src="https://i.pravatar.cc/150?img=12">
  </div>

  <div class="header-icons">
    <i class="fa-solid fa-bell"></i>
    <i id="theme-toggle" class="fa-solid fa-sun"></i>
  </div>

</div>

<!-- CONTENT -->

<div class="container">

  <h2 class="title">
    <i class="fa-regular fa-calendar-check"></i>
    Jadwal Kompetisi
  </h2>

  <div class="filter-tabs">

    <button class="active">
      Semua
    </button>

    <button>
      Akan Datang
    </button>

    <button>
      Berlangsung
    </button>

    <button>
      Selesai
    </button>

  </div>

  <!-- DATA FIRESTORE AKAN MASUK KE SINI -->

  <div id="jadwal-list">

    <div class="schedule-card">

      <h3>Memuat data...</h3>

    </div>

  </div>

</div>

<!-- NAVIGATION -->

<div class="mobile-nav">

  <div
  class="mobile-item"
  onclick="window.location.href='dashboard.html'">

    <i class="fa-solid fa-house"></i>

    <span>Home</span>

  </div>

  <div class="mobile-item active">

    <i class="fa-regular fa-calendar-check"></i>

    <span>Jadwal</span>

  </div>

  <div
  class="mobile-item"
  onclick="window.location.href='transaksi.html'">

    <i class="fa-regular fa-credit-card"></i>

    <span>Transaksi</span>

  </div>

  <div
  class="mobile-item"
  onclick="window.location.href='pengumuman.html'">

    <i class="fa-regular fa-newspaper"></i>

    <span>Pengumuman</span>

  </div>

  <div
  class="mobile-item"
  onclick="window.location.href='riwayat.html'">

    <i class="fa-regular fa-file-lines"></i>

    <span>Riwayat</span>

  </div>

</div>

<!-- FIRESTORE -->

<script type="module">

import { firestore }
from "./firebase.js";

import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const container =
document.getElementById("jadwal-list");

const buttons =
document.querySelectorAll(".filter-tabs button");

let semuaData = [];

async function loadKompetisi(){

container.innerHTML = `
<div class="schedule-card">
<h3>Memuat data...</h3>
</div>
`;

try{

const snapshot =
await getDocs(
collection(
firestore,
"kompetisi"
)
);

semuaData = [];

snapshot.forEach((docSnap)=>{

semuaData.push({
id:docSnap.id,
...docSnap.data()
});

});

renderData("Semua");

}catch(error){

container.innerHTML = `
<div class="schedule-card">
<h3>Gagal mengambil data</h3>
<p>${error.message}</p>
</div>
`;

}

}

function renderData(filter){

container.innerHTML = "";

let dataTampil = semuaData;

if(filter === "Akan Datang"){

dataTampil =
semuaData.filter(
item =>
item.status === "Akan Datang"
);

}

if(filter === "Berlangsung"){

dataTampil =
semuaData.filter(
item =>
item.status === "Berlangsung"
);

}

if(filter === "Selesai"){

dataTampil =
semuaData.filter(
item =>
item.status === "Selesai"
);

}

if(dataTampil.length === 0){

container.innerHTML = `
<div class="schedule-card">
<h3>Belum ada data</h3>
</div>
`;

return;

}

dataTampil.forEach((data)=>{

let warnaStatus = "upcoming";

if(data.status === "Berlangsung"){

warnaStatus = "ongoing";

}

if(data.status === "Selesai"){

warnaStatus = "finished";

}

container.innerHTML += `

<div class="schedule-card">

<h3>
${data.nama || "-"}
</h3>

<p>
📅 ${data.tanggal || "-"}
</p>

<p>
⏰ ${data.jam || "-"}
</p>

<span class="status ${warnaStatus}">
${data.status || "-"}
</span>

<br><br>

<button
class="detail-btn"
onclick="window.location.href='detail.html?id=${data.id}'">

Lihat Detail

</button>

</div>

`;

});

}

buttons.forEach((btn)=>{

btn.addEventListener("click",()=>{

buttons.forEach((b)=>{

b.classList.remove("active");

});

btn.classList.add("active");

renderData(
btn.innerText.trim()
);

});

});

loadKompetisi();

</script>

<!-- DARK MODE -->

<script>

const themeBtn =
document.getElementById("theme-toggle");

themeBtn.onclick = () => {

  document.body.classList.toggle("dark");

  if(
  document.body.classList.contains("dark")
  ){

    themeBtn.classList.remove("fa-sun");
    themeBtn.classList.add("fa-moon");

  }else{

    themeBtn.classList.remove("fa-moon");
    themeBtn.classList.add("fa-sun");

  }

};

</script>

</body>
</html>
