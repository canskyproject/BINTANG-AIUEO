<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jadwal Kompetisi</title>

<link rel="stylesheet" href="jadwal.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="icon" href="logo.jpg">
</head>

<body>

<!-- HEADER -->

<div class="top-header">

<div class="logo-area">
<img src="logo.jpg" alt="Logo">
</div>

<div class="profile-center">
<img src="https://i.pravatar.cc/150?img=12">
</div>

<div class="header-icons">
<i class="fa-solid fa-bell"></i>
<i id="theme-toggle" class="fa-solid fa-sun"></i>
</div>

</div>

<!-- CONTENT -->

<div class="container">

<h2 class="title">
<i class="fa-regular fa-calendar-check"></i>
Jadwal Kompetisi
</h2>

<!-- FILTER -->

<div class="filter-tabs">

<button class="active">
Semua
</button>

<button>
Akan Datang
</button>

<button>
Berlangsung
</button>

<button>
Selesai
</button>

</div>

<!-- CARD 1 -->

<div class="schedule-card">

<h3>
Olimpiade BINTANG 2026
</h3>

<p>
📅 30 Mei 2026
</p>

<p>
⏰ 08:00 WIB
</p>

<span class="status upcoming">
Akan Datang
</span>

<button class="detail-btn">
Lihat Detail
</button>

</div>

<!-- CARD 2 -->

<div class="schedule-card">

<h3>
Kompetisi AI Nasional
</h3>

<p>
📅 12 Juni 2026
</p>

<p>
⏰ 09:00 WIB
</p>

<span class="status upcoming">
Akan Datang
</span>

<button class="detail-btn">
Lihat Detail
</button>

</div>

</div>

<!-- NAVIGATION -->

<div class="mobile-nav">

<div
class="mobile-item"
onclick="window.location.href='dashboard.html'">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</div>

<div class="mobile-item active">

<i class="fa-regular fa-calendar-check"></i>

<span>Jadwal</span>

</div>

<div
class="mobile-item"
onclick="window.location.href='transaksi.html'">

<i class="fa-regular fa-credit-card"></i>

<span>Transaksi</span>

</div>

<div
class="mobile-item"
onclick="window.location.href='pengumuman.html'">

<i class="fa-regular fa-newspaper"></i>

<span>Pengumuman</span>

</div>

<div
class="mobile-item"
onclick="window.location.href='riwayat.html'">

<i class="fa-regular fa-file-lines"></i>

<span>Riwayat</span>

</div>

</div>

<script>

const themeBtn =
document.getElementById("theme-toggle");

themeBtn.onclick = () => {

document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){

themeBtn.classList.remove("fa-sun");
themeBtn.classList.add("fa-moon");

}else{

themeBtn.classList.remove("fa-moon");
themeBtn.classList.add("fa-sun");

}

};

</script>

</body>
</html>
